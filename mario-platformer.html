<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маріо Платформер</title>
    <link rel="stylesheet" href="mario-platformer.css">
</head>
<body>
    <div class="game-header">
        <h1>Маріо Платформер</h1>
        <p>Керуйте героєм за допомогою стрілок, натисніть пробіл, щоб стрибати.</p>
    </div>
    <div class="game-wrapper">
        <canvas id="game-canvas"></canvas>
        <div class="game-info">
            <p id="score">Score: 0</p>
            <button id="restart">Перезапустити</button>
        </div>
    </div>
    <script src="mario-platformer.js"></script>
</body>
</html>
